publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  bloc: ^9.2.1
  bloc_presentation: ^1.1.2+3
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  envied: ^1.3.8
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
